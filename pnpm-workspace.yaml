ignoreWorkspaceRootCheck: true
shellEmulator: true
trustPolicy: no-downgrade
# Ecosystem-ci smoke test only: preview builds are published by the registry
# bridge without provenance attestation, which trips the no-downgrade check.
# Real vite-plus npm releases are published with provenance.
trustPolicyExclude:
  - vite-plus
  - "@voidzero-dev/*"

packages:
  - docs

minimumReleaseAgeExclude:
  - bumpp@12.1.1

allowBuilds:
  esbuild: true
