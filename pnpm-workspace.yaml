ignoreWorkspaceRootCheck: true
shellEmulator: true
trustPolicy: no-downgrade
# Ecosystem-ci smoke test only: preview builds are published by the registry
# bridge without provenance attestation, which trips the no-downgrade check.
# Real vite-plus npm releases are published with provenance.
trustPolicyExclude:
  - vite-plus
  - '@voidzero-dev/*'

packages:
  - docs

minimumReleaseAgeExclude:
  - bumpp@12.1.1
  - '@voidzero-dev/vite-plus-core@0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642'
  - '@voidzero-dev/vite-plus-darwin-arm64@0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642'
  - '@voidzero-dev/vite-plus-darwin-x64@0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642'
  - '@voidzero-dev/vite-plus-linux-x64-musl@0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642'
  - vite-plus@0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642

allowBuilds:
  esbuild: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642
  vite-plus: 0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
